<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 500px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="file"] {
            padding: 10px;
        }

        #preview {
            display: none;
            width: 120px;
            height: 120px;
            object-fit: cover;
            margin: 15px auto;
            border-radius: 50%;
            border: 3px solid #667eea;
        }

        button {
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background-color: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #5568d9;
        }

        #mensagem {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Cadastro</h1>

        <form id="formCadastro">

            <label for="nome">Nome completo:</label>
            <input 
                type="text" 
                id="nome" 
                placeholder="Digite seu nome" 
                required
            >

            <label for="email">E-mail:</label>
            <input 
                type="email" 
                id="email" 
                placeholder="Digite seu e-mail" 
                required
            >

            <label for="senha">Senha:</label>
            <input 
                type="password" 
                id="senha" 
                placeholder="Digite sua senha" 
                required
            >

            <label for="endereco">Endereço:</label>
            <input 
                type="text" 
                id="endereco" 
                placeholder="Digite seu endereço" 
                required
            >

            <label for="cpf">CPF:</label>
            <input 
                type="text" 
                id="cpf" 
                placeholder="000.000.000-00" 
                maxlength="14" 
                required
            >

            <label for="imagem">Imagem de perfil:</label>
            <input 
                type="file" 
                id="imagem" 
                accept="image/*"
            >

            <img 
                id="preview" 
                alt="Prévia da imagem"
            >

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <p id="mensagem"></p>

    </div>

    <script>

        // Elementos do formulário
        const form = document.getElementById("formCadastro");
        const mensagem = document.getElementById("mensagem");
        const cpf = document.getElementById("cpf");
        const imagem = document.getElementById("imagem");
        const preview = document.getElementById("preview");


        // Formatação automática do CPF
        cpf.addEventListener("input", function () {

            let valor = cpf.value.replace(/\D/g, "");

            if (valor.length > 11) {
                valor = valor.substring(0, 11);
            }

            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

            cpf.value = valor;
        });


        // Mostrar prévia da imagem
        imagem.addEventListener("change", function () {

            const arquivo = imagem.files[0];

            if (arquivo) {

                preview.src = URL.createObjectURL(arquivo);

                preview.style.display = "block";
            }
        });


        // Enviar cadastro
        form.addEventListener("submit", function (event) {

            event.preventDefault();

            // Pegar os valores digitados
            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const endereco = document.getElementById("endereco").value;
            const cpfValor = document.getElementById("cpf").value;

            // Pegar o nome da imagem
            const arquivoImagem = imagem.files[0];

            const nomeImagem = arquivoImagem
                ? arquivoImagem.name
                : "Nenhuma imagem selecionada";


            // Criar o conteúdo do TXT
            const conteudo = `
========================================
           CADASTRO DE USUÁRIO
========================================

Nome completo:
${nome}

E-mail:
${email}

Senha:
${senha}

Endereço:
${endereco}

CPF:
${cpfValor}

Imagem de perfil:
${nomeImagem}

========================================
       CADASTRO REALIZADO COM SUCESSO
========================================
`;


            // Criar o arquivo TXT
            const arquivo = new Blob(
                [conteudo],
                {
                    type: "text/plain;charset=utf-8"
                }
            );


            // Criar o link de download
            const link = document.createElement("a");

            link.href = URL.createObjectURL(arquivo);

            link.download = "cadastro.txt";


            // Iniciar o download
            link.click();


            // Liberar memória
            URL.revokeObjectURL(link.href);


            // Mostrar mensagem
            mensagem.textContent =
                "Cadastro realizado! O arquivo cadastro.txt foi baixado.";

            mensagem.style.color = "green";


            // Limpar formulário
            form.reset();

            preview.style.display = "none";
        });

    </script>

</body>

</html>
